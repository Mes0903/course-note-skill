[project]
name = "course-notes"
version = "0.1.0"
description = "Codex-first timestamped transcript notes from video URLs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.2,<2",
  "opencv-python>=5,<6",
  "yt-dlp[default]>=2026.6.9,<2027",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12>=12,<13",
  "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
course-notes = "course_notes.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_notes"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
